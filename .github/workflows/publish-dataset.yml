name: 定时发布题目数据集（2026-09-11）

# 题目数据集托管于 Hugging Face（Carlyer/hy3-math-forensics-dataset），
# 在 2026-09-11 前不进入本仓库；到时间后由本 workflow 自动拉回并提交。
# cron 为 UTC 时间：0 0 11 9 * = 9 月 11 日 00:00 UTC（北京时间 08:00）。
# 如需提前/补跑，可在 Actions 页面手动触发（workflow_dispatch）。

on:
  schedule:
    - cron: '0 0 11 9 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install huggingface_hub

      - name: 从 Hugging Face 下载数据集
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/download_dataset_from_hf.py --dest .

      - name: 提交并推送数据文件
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dataset/
          if git diff --cached --quiet; then
            echo "数据集无变化，跳过提交"
            exit 0
          fi
          git commit -m "data: 按计划发布题目数据集（转自 Hugging Face）"
          git push
